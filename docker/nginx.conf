# ==============================================================================
# Production Nginx for ACEDRA: TLS termination, static frontend, reverse proxy to the API.
#
# Certificates are read from /etc/nginx/certs (mounted from TLS_CERT_DIR, see docker-compose.prod.yml):
#   fullchain.pem  — certificate chain
#   privkey.pem    — private key
# Port 80 only redirects to HTTPS and answers ACME (Let's Encrypt) HTTP-01 challenges.
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent" rt=$request_time';
    # $uri (not $request) keeps query strings — which can carry single-use tokens — out of the logs.
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 12M;   # uploads are limited to 10 MB by the API

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Coarse per-address limits in front of the API's own (finer) limits.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=5r/s;
    limit_req_status 429;

    upstream backend_upstream {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ---------------------------------------------------------------- HTTP: redirect + ACME + health
    server {
        listen 80;
        server_name _;

        location = /nginx-health { access_log off; return 200 "ok\n"; }
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ---------------------------------------------------------------- HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # No inline scripts: the theme bootstrap is a file (/theme-init.js). Inline styles are still needed
        # by the charting library.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        root /usr/share/nginx/html;
        index index.html;

        # Fingerprinted build output never changes; everything else (index.html, theme-init.js) is revalidated.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
            try_files $uri $uri/ /index.html;
        }

        location ~ ^/(health|ready|api/health|api/ready)$ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # Assistant: slower, unbuffered responses.
        location /api/v1/ai/ {
            limit_req zone=ai_limit burst=10 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Overwrite (never append to) X-Forwarded-For: the API trusts this value for rate limiting and audit.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;   # imports and exports can take a while
        }
    }
}
