name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests on SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: acedra
          POSTGRES_PASSWORD: acedra-ci
          POSTGRES_DB: acedra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acedra -d acedra_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations match the models
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./ci_migrations.db
        run: |
          alembic upgrade head
          alembic check
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://acedra:acedra-ci@localhost:5432/acedra_test
        run: pytest -q

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  images:
    name: Production images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend.prod -t acedra-backend:ci .
      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend.prod -t acedra-frontend:ci .
      - name: Backend image starts and refuses insecure configuration
        run: |
          # The image defaults to ENVIRONMENT=production, so starting it without a secret must fail.
          if docker run --rm --entrypoint python acedra-backend:ci -c "import app.core.config"; then
            echo "Image accepted an insecure default configuration" && exit 1
          fi
          docker run --rm --entrypoint gunicorn acedra-backend:ci --version
