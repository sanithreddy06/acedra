# ==============================================================================
# Production Docker Compose for ACEDRA
# Integrates:
# - PostgreSQL 16 with pgvector extension
# - Production Gunicorn/Uvicorn FastAPI Backend
# - Production Nginx React Frontend with Reverse Proxy, TLS termination & Rate Limiting
# - Redis as the shared rate-limit store for the API workers
#
# Before the first start: put fullchain.pem and privkey.pem in TLS_CERT_DIR (default ./docker/certs).
# See documentation/DEPLOYMENT_GUIDE.md.
# ==============================================================================

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: acedra_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acedra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-acedra}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - acedra_backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acedra} -d ${POSTGRES_DB:-acedra}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis:
    image: redis:7-alpine
    container_name: acedra_prod_redis
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - acedra_backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.prod
    container_name: acedra_prod_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-acedra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-acedra}
      - SECRET_KEY=${SECRET_KEY:?JWT secret key must be configured in .env.production}
      - ENVIRONMENT=production
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS to your public origin(s)}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:?Set PUBLIC_APP_URL (used in invitation and reset links)}
      - SEED_DEMO_DATA=false
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - RATE_LIMIT_DEFAULT=${RATE_LIMIT_DEFAULT:-240/minute}
      - RATE_LIMIT_STORAGE_URI=redis://redis:6379/0
      - LEGAL_ACCEPTANCE_ENFORCED=${LEGAL_ACCEPTANCE_ENFORCED:-true}
      - CONTACT_RATE_LIMIT=${CONTACT_RATE_LIMIT:-5/hour}
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-lexical}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMAIL_PROVIDER=smtp
      - EMAIL_FROM=${EMAIL_FROM:?Set EMAIL_FROM to the sender address for invitations and resets}
      - SMTP_HOST=${SMTP_HOST:?Set SMTP_HOST (production always delivers email through SMTP)}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
    networks:
      - acedra_backend_net
      - acedra_frontend_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend.prod
    container_name: acedra_prod_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${TLS_CERT_DIR:-./docker/certs}:/etc/nginx/certs:ro
      - ${ACME_WEBROOT:-./docker/acme}:/var/www/certbot:ro
    networks:
      - acedra_frontend_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

volumes:
  postgres_prod_data:
    name: acedra_postgres_prod_data

networks:
  acedra_backend_net:
    driver: bridge
    internal: true
  acedra_frontend_net:
    driver: bridge
